name: Daily Brief

# Generate a fresh daily report and publish to GitHub Pages.
#
# One-time setup for forkers (see README → "Run on GitHub Actions"):
#   1. Settings → Actions → General → enable workflows (forked repos start disabled)
#   2. Settings → Pages → Build & deployment → Source: "Deploy from a branch" → gh-pages / root
#   3. Settings → Secrets and variables → Actions:
#        - Secrets: ANTHROPIC_API_KEY (or OPENAI / DEEPSEEK / MINIMAX as you prefer)
#        - Variables (all optional, sensible defaults provided):
#            LLM_BACKEND          anthropic | openai | deepseek | minimax    (default: anthropic)
#            LLM_MODEL            e.g. claude-sonnet-4-6 / gpt-4o-mini       (backend default if unset)
#            LLM_FALLBACK_BACKEND backend to retry on digest failure         (default: anthropic)
#                                set to "" to disable. Same value as LLM_BACKEND is ignored.
#            REPORT_LOCALE        zh | en                                    (default: zh)
#            REPORT_TZ            IANA tz, e.g. Asia/Shanghai / UTC          (default: Asia/Shanghai)
#            REPORT_DAYS          day-of-week filter (cron-style 0-6 SUN=0)  (default: * — every day)
#                                 examples: "*" / "1-5" (weekdays) / "1,3,5" (MWF)
#   4. Trigger once manually from Actions tab to seed gh-pages.
#
# After first successful run your report is live at:
#   https://<your-username>.github.io/<repo-name>/
#
# Schedule mechanics: cron fires daily at 23:07 UTC (07:07 CST next morning) to avoid GitHub's
# :00 high-load delays. A short "gate" job checks REPORT_DAYS and only allows
# the build job to run on matching days. workflow_dispatch and push always bypass.

on:
  schedule:
    # Daily at 23:07 UTC = 07:07 Beijing time (next morning). Gate filters by day-of-week.
    - cron: '7 23 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write  # needed to push to gh-pages branch

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  gate:
    name: Time gate
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.check.outputs.should-run }}
    steps:
      - name: Check schedule
        id: check
        env:
          REPORT_TZ: ${{ vars.REPORT_TZ || secrets.REPORT_TZ || 'Asia/Shanghai' }}
          REPORT_DAYS: ${{ vars.REPORT_DAYS || secrets.REPORT_DAYS || '*' }}
        run: |
          EVENT_NAME="${{ github.event_name }}"
          set -euo pipefail

          # Manual triggers and code pushes always run
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$EVENT_NAME" = "push" ] || [ "$EVENT_NAME" = "pull_request" ]; then
            echo "Trigger '$EVENT_NAME' — bypassing time gate"
            echo "should-run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TZ_VAL="${REPORT_TZ}"
          DAYS_VAL="${REPORT_DAYS}"

          NOW_DOW=$(TZ="$TZ_VAL" date +%w)
          NOW_PRINT=$(TZ="$TZ_VAL" date '+%Y-%m-%d %H:%M %Z')

          echo "Now in $TZ_VAL: $NOW_PRINT (dow=$NOW_DOW)"
          echo "Configured REPORT_DAYS='$DAYS_VAL'"

          # Day-of-week match
          day_match=false
          if [ "$DAYS_VAL" = "*" ]; then
            day_match=true
          else
            IFS=',' read -ra DLIST <<< "$DAYS_VAL"
            for d in "${DLIST[@]}"; do
              d_trim="${d// /}"
              if [[ "$d_trim" == *-* ]]; then
                start="${d_trim%-*}"
                end="${d_trim#*-}"
                if [ "$NOW_DOW" -ge "$start" ] && [ "$NOW_DOW" -le "$end" ]; then
                  day_match=true
                  break
                fi
              else
                if [ "$NOW_DOW" -eq "$d_trim" ]; then
                  day_match=true
                  break
                fi
              fi
            done
          fi

          echo "day_match=$day_match"

          if [ "$day_match" = "true" ]; then
            echo "✓ Match — proceeding to build"
            echo "should-run=true" >> "$GITHUB_OUTPUT"
          else
            echo "✗ No match — skipping"
            echo "should-run=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build & publish
    needs: gate
    if: needs.gate.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Bring previous reports into the workspace so they survive each run
      # and so build-site can list them all in the archive.
      - name: Restore existing reports from gh-pages
        run: |
          mkdir -p daily_reports
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages --depth=1
            git --work-tree=daily_reports checkout origin/gh-pages -- . || true
            # Drop the index/archive — build-site regenerates them
            rm -f daily_reports/index.html daily_reports/archive.html
            echo "Restored $(ls -1d daily_reports/20*/ 2>/dev/null | wc -l) prior report dirs"
          else
            echo "gh-pages doesn't exist yet — first run"
          fi

      - name: Generate today's report
        env:
          # 2026-09-04: switch to MiniMax China Coding Plan (MiniMax-M3).
          # Backend/model/endpoint hardcoded so the international
          # api.minimax.io default can never silently kick in.
          LLM_BACKEND: minimax
          LLM_MODEL: MiniMax-M3
          LLM_FALLBACK_BACKEND: ''
          MINIMAX_BASE_URL: 'https://api.minimaxi.com/v1'
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          REPORT_LOCALE: ${{ vars.REPORT_LOCALE || 'zh' }}
          REPORT_TZ: ${{ vars.REPORT_TZ || secrets.REPORT_TZ || 'Asia/Shanghai' }}
          WEB_MODE: 'true'
        run: npm run daily

      - name: Build static site (index + archive)
        run: npm run build-site

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./daily_reports
          publish_branch: gh-pages
          keep_files: false  # we restored everything above, so a clean publish is fine
          commit_message: 'daily: report for ${{ github.run_id }}'

